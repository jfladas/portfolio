name: Update Spotify Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_spotify]

permissions:
  contents: write

concurrency:
  group: spotify-data-update
  cancel-in-progress: true

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Spotify data
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/fetch-spotify.mjs spotify.json

      # spotify.json lives on its own branch so these commits don't pile up on main; the branch is created on the
      # first run, and a commit only happens when the data changed
      - name: Commit to the spotify-data branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir data && cd data
          git init -q
          git remote add origin "$REPO_URL"
          if git fetch -q --depth 1 origin spotify-data; then
            git checkout -q -b spotify-data FETCH_HEAD
          else
            git checkout -q --orphan spotify-data
          fi
          cp ../spotify.json .
          git add spotify.json
          git -c user.name="GitHub Actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update Spotify data" || { echo "nothing changed"; exit 0; }
          git push -q origin spotify-data
