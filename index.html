<head>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261030">
  <meta name="apple-mobile-web-app-title" content="jfladas">
  <link rel="manifest" href="/site.webmanifest?v=20261030">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- the site brings its own dark themes; keeps browser auto-dark and Dark Reader from recoloring it -->
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <meta name="description"
    content="Portfolio of Lukas Bucher (jfladas), Digital Solutions Engineer and Digital Ideator: web development, games, UX and creative coding projects.">

    content="Digital Solutions Engineer and Digital Ideator. Web development, games, UX and creative coding projects.">

  <meta property="og:image" content="https://www.jfladas.com/portfolio.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="676">

  <meta name="twitter:card" content="summary_large_image">
  <!-- / redirects to /about in the app; prerendered pages get their own URL here (scripts/project-previews.js) -->
  <link rel="canonical" href="https://www.jfladas.com/about">
  <title>jfladas ⬝ Lukas Bucher</title>
  <!-- visitor stats (Umami Cloud): no cookies, no IP addresses stored; only counts on the live domain, not in dev,
       and skips browsers with "Do Not Track". Events come from data-umami-event attributes and umami.track() -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="de16df9b-b46b-4fec-9c00-10feb4d673d7"
    data-domains="www.jfladas.com" data-do-not-track="true"></script>
  <script>
    // Restore deep-link URLs redirected by public/404.html on GitHub Pages.
    (function (l) {
      var params = new URLSearchParams(l.search)
      var p = params.get('p')

      if (p) {
        var path = p.replace(/~and~/g, '&')
        var q = params.get('q')
        var query = q ? '?' + q.replace(/~and~/g, '&') : ''

        window.history.replaceState(null, null, path + query + l.hash)
      }
    })(window.location)
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
